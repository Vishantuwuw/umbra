name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# A newer push replaces a run that's still testing, so two releases never race to
# publish (an older one finishing last would become "latest").
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Run a Windows .exe on macOS
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      # The smoke test runs Steam and other Windows programs, so no token is left on disk
      # (checkout's saved credentials) or in their environment.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Engine + bottle + hello.exe
        env:
          UMBRA_HOME: ${{ runner.temp }}/umbra-home
          SHOTS_DIR: ${{ runner.temp }}
        run: npx electron test/smoke.js
      - name: Screenshot the app UI
        env:
          UMBRA_HOME: ${{ runner.temp }}/umbra-home
        run: |
          npx electron . &
          for i in 1 2 3 4 5 6; do sleep 0.6; screencapture -x "$RUNNER_TEMP/mac-splash-$i.png"; done
          sleep 8 && screencapture -x "$RUNNER_TEMP/mac-library.png"
          pkill -f electron || true
      - name: Publish screenshots to the screenshots branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/shots" && cp "$RUNNER_TEMP"/*.png "$RUNNER_TEMP/shots/"
          cd "$RUNNER_TEMP/shots"
          git init -q -b screenshots && git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Mac screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/*.png

  build:
    name: Build Umbra.app
    needs: smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Account server settings
        env:
          SUPABASE_URL: ${{ secrets.UMBRA_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.UMBRA_SUPABASE_ANON_KEY }}
          PROVIDERS: ${{ vars.UMBRA_SIGNIN_PROVIDERS }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e 'const p=(process.env.PROVIDERS||"").split(/[ ,]+/).filter(Boolean); require("fs").writeFileSync("src/config.local.json", JSON.stringify({supabaseUrl: process.env.SUPABASE_URL, supabaseAnonKey: process.env.SUPABASE_ANON_KEY, ...(p.length ? {providers: p} : {})}))'
            echo "Accounts: on (sign-in required)"
          else
            echo "::warning::UMBRA_SUPABASE_URL / UMBRA_SUPABASE_ANON_KEY secrets not set; this build has accounts off"
          fi
      - name: Make the app hard to reverse-engineer
        run: node build/obfuscate.js
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify bundle
        run: |
          for app in dist/mac*/Umbra.app; do
            codesign --verify --deep "$app" && echo "signature ok: $app"
            plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'
          done
      - name: Launch the packaged app
        env:
          UMBRA_HOME: ${{ runner.temp }}/umbra-launch
        run: |
          # The release build is obfuscated and has Electron's fuses flipped; make
          # sure Umbra.app still boots and stays up before we publish it.
          app=$(ls -d dist/mac-arm64/Umbra.app 2>/dev/null || ls -d dist/mac/Umbra.app)
          echo "launching $app"
          "$app/Contents/MacOS/Umbra" & pid=$!
          sleep 12
          if kill -0 "$pid" 2>/dev/null; then
            screencapture -x "$RUNNER_TEMP/launch.png" || true
            kill "$pid" 2>/dev/null || true
            echo "app is running"
          else
            wait "$pid"; rc=$?
            echo "::error::Umbra.app exited early (rc=$rc) after obfuscation + fuses"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-screenshot
          path: ${{ runner.temp }}/launch.png
      - uses: actions/upload-artifact@v4
        with:
          name: Umbra-mac
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Read version
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          sed -e "s#{{REPO}}#$GITHUB_REPOSITORY#g" -e "s#{{SHA}}#$GITHUB_SHA#g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          # Only the highest version is marked latest (Umbra's update check reads it).
          git fetch -q --tags origin
          HIGHEST=$(git tag -l 'v*' | sort -V | tail -1)
          LATEST=false; [ "$HIGHEST" = "$TAG" ] && LATEST=true
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Umbra $TAG" --notes-file "$RUNNER_TEMP/notes.md" --latest=$LATEST
            gh release upload "$TAG" dist/*.dmg dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.dmg dist/*.zip --verify-tag --latest=$LATEST \
              --title "Umbra $TAG" --notes-file "$RUNNER_TEMP/notes.md"
          fi
      - name: Keep screenshots out of releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Screenshots live in the README; releases only carry the app downloads.
          for tag in $(gh release list --limit 100 --json tagName -q '.[].tagName'); do
            for asset in $(gh release view "$tag" --json assets -q '.assets[].name' | grep -i '\.png$' || true); do
              gh release delete-asset "$tag" "$asset" -y
            done
            body=$(gh release view "$tag" --json body -q .body)
            if printf '%s' "$body" | grep -q '^## Screenshots'; then
              printf '%s\n' "$body" | sed '/^## Screenshots/,$d' > "$RUNNER_TEMP/old-notes.md"
              gh release edit "$tag" --notes-file "$RUNNER_TEMP/old-notes.md"
            fi
          done
