name: Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    name: Run a Windows .exe on macOS
    runs-on: macos-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Ensure Rosetta 2
        run: sudo softwareupdate --install-rosetta --agree-to-license || true
      - name: Engine + bottle + hello.exe
        env:
          UMBRA_HOME: ${{ runner.temp }}/umbra-home
          SHOTS_DIR: ${{ runner.temp }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx electron test/smoke.js
      - name: Screenshot the app UI
        env:
          UMBRA_HOME: ${{ runner.temp }}/umbra-home
        run: |
          npx electron . &
          for i in 1 2 3 4 5 6; do sleep 0.6; screencapture -x "$RUNNER_TEMP/mac-splash-$i.png"; done
          sleep 8 && screencapture -x "$RUNNER_TEMP/mac-library.png"
          pkill -f electron || true
      - name: Publish screenshots to the screenshots branch
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p "$RUNNER_TEMP/shots" && cp "$RUNNER_TEMP"/*.png "$RUNNER_TEMP/shots/"
          cd "$RUNNER_TEMP/shots"
          git init -q -b screenshots && git add .
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "Mac screenshots from ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-screenshots
          path: ${{ runner.temp }}/*.png

  build:
    name: Build Umbra.app
    needs: smoke
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Account server settings
        env:
          SUPABASE_URL: ${{ secrets.UMBRA_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.UMBRA_SUPABASE_ANON_KEY }}
          PROVIDERS: ${{ vars.UMBRA_SIGNIN_PROVIDERS }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            node -e 'const p=(process.env.PROVIDERS||"").split(/[ ,]+/).filter(Boolean); require("fs").writeFileSync("src/config.local.json", JSON.stringify({supabaseUrl: process.env.SUPABASE_URL, supabaseAnonKey: process.env.SUPABASE_ANON_KEY, ...(p.length ? {providers: p} : {})}))'
            echo "Accounts: on (sign-in required)"
          else
            echo "::warning::UMBRA_SUPABASE_URL / UMBRA_SUPABASE_ANON_KEY secrets not set; this build has accounts off"
          fi
      - run: npm run dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Verify bundle
        run: |
          for app in dist/mac*/Umbra.app; do
            codesign --verify --deep "$app" && echo "signature ok: $app"
            plutil -p "$app/Contents/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleShortVersionString'
          done
      - uses: actions/upload-artifact@v4
        with:
          name: Umbra-mac
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Read version
        id: ver
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Publish release to the public repo
        if: github.ref == 'refs/heads/main'
        env:
          # Fine-grained token with Contents: read and write on the public repo.
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          PUBLIC: ${{ vars.UMBRA_PUBLIC_REPO || 'coldvini/umbra' }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the PUBLIC_REPO_TOKEN secret so this build can publish to $PUBLIC"
            exit 1
          fi
          sed -e "s#{{REPO}}#$PUBLIC#g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          # The public repo holds no code: it keeps only the newest release, tagged on its
          # README-only main branch, so the release's "Source code" download is just the README.
          for t in $(gh release list -R "$PUBLIC" --limit 100 --json tagName -q '.[].tagName'); do
            gh release delete "$t" -R "$PUBLIC" -y --cleanup-tag
          done
          for t in $(gh api "repos/$PUBLIC/tags" --paginate -q '.[].name'); do
            gh api -X DELETE "repos/$PUBLIC/git/refs/tags/$t"
          done
          gh release create "$TAG" dist/*.dmg dist/*.zip -R "$PUBLIC" --target main --latest \
            --title "Umbra $TAG" --notes-file "$RUNNER_TEMP/notes.md"
