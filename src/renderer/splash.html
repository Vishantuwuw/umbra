<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'">
<title>Umbra</title>
<link rel="stylesheet" href="fonts.css">
<style>
  :root { --violet: #8b5cf6; --cyan: #22d3ee; }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { font-family: 'Inter Variable', -apple-system, BlinkMacSystemFont, sans-serif; color: #fff; -webkit-app-region: drag; }
  .card {
    position: absolute; inset: 0; border-radius: 22px; overflow: hidden;
    background: radial-gradient(120% 90% at 50% 0%, #0d0b14 0%, #000 60%);
    border: 1px solid rgba(255,255,255,.08);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .grain { position: absolute; inset: 0; opacity: .5; pointer-events: none;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px); background-size: 3px 3px; }
  .eclipse { position: relative; width: 108px; height: 108px; margin-bottom: 26px; }
  .corona { position: absolute; inset: -6px; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--violet), var(--cyan), transparent 40%, var(--violet) 70%, transparent 85%, var(--violet));
    filter: blur(10px); opacity: .85; animation: spin 3.2s linear infinite; }
  .ring { position: absolute; inset: -2px; border-radius: 50%;
    background: conic-gradient(from 90deg, rgba(255,255,255,.9), rgba(167,139,250,.6), transparent 35%, transparent 65%, rgba(34,211,238,.7), rgba(255,255,255,.9));
    animation: spin 2.2s linear infinite reverse; }
  .moon { position: absolute; inset: 1px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #111 0%, #000 70%); }
  .word { font-weight: 700; letter-spacing: .55em; font-size: 22px; padding-left: .55em; }
  .tag { margin-top: 8px; color: rgba(255,255,255,.42); font-size: 11.5px; letter-spacing: .18em; text-transform: uppercase; }
  .pct { margin-top: 30px; font-size: 44px; font-weight: 200; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .pct small { font-size: 18px; color: rgba(255,255,255,.4); margin-left: 2px; }
  .bar { width: 320px; height: 3px; margin-top: 14px; border-radius: 3px; background: rgba(255,255,255,.07); overflow: visible; position: relative; }
  .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 1%; border-radius: 3px;
    background: linear-gradient(90deg, var(--violet), var(--cyan)); box-shadow: 0 0 14px rgba(139,92,246,.8), 0 0 4px rgba(34,211,238,.9); }
  .status { margin-top: 14px; height: 16px; font-size: 12px; color: rgba(255,255,255,.5); }
  .ver { position: absolute; bottom: 14px; font-size: 10.5px; color: rgba(255,255,255,.22); letter-spacing: .1em; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .out { animation: fade .45s ease forwards; }
  @keyframes fade { to { opacity: 0; transform: scale(.98); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="grain"></div>
    <div class="eclipse"><div class="corona"></div><div class="ring"></div><div class="moon"></div></div>
    <div class="word">UMBRA</div>
    <div class="tag">Windows apps · on your Mac</div>
    <div class="pct"><span id="n">1</span><small>%</small></div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="status" id="status">Starting</div>
    <div class="ver">MADE BY VINI</div>
  </div>
<script src="splash.js"></script>
</body>
</html>
